<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapter 4 - ISTQB App</title>
    <style>
      :root { color-scheme: dark; --bg: #07111f; --text: #e2e8f0; --muted: #94a3b8; --accent: #22c55e; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: linear-gradient(135deg, var(--bg), #111827); color: var(--text); }
      .page { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
      .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
      .topbar a { color: var(--accent); text-decoration:none; font-weight:600; }
      .hero, .panel { background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 24px; box-shadow: 0 16px 40px rgba(0,0,0,0.2); }
      .hero { padding: 28px; margin-bottom: 18px; }
      .hero h1 { margin: 0 0 10px; }
      .hero p { color: var(--muted); margin: 0 0 16px; }
      .pill-list, .tabs, .quiz-actions { display:flex; flex-wrap:wrap; gap:10px; }
      .pill { padding:8px 12px; border-radius:999px; background: rgba(34,197,94,0.16); color:#dcfce7; font-size: 0.9rem; }
      .panel { padding: 20px; }
      .tabs { margin-bottom:16px; }
      .tabs button, .quiz-actions button { border:none; border-radius:999px; padding:10px 14px; background:#1e293b; color:var(--text); cursor:pointer; }
      .tabs button.active, .quiz-actions button { background: linear-gradient(90deg, var(--accent), #38bdf8); color:white; font-weight:700; }
      .content-area { line-height:1.7; }
      .content-area h1, .content-area h2, .content-area h3 { color:#f8fafc; }
      .content-area ul { padding-left:1.2rem; }
      .content-area code { background: rgba(255,255,255,0.08); padding:0.15rem 0.35rem; border-radius:0.35rem; }
      .notice, .quiz-summary { padding:14px 16px; border-radius:16px; background: rgba(30,41,59,0.9); border:1px solid rgba(56,189,248,0.22); }
      .glossary-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
      .glossary-card, .quiz-card { background: rgba(15, 23, 42, 0.78); border:1px solid rgba(148,163,184,0.2); border-radius:16px; padding:14px; }
      .glossary-term { font-weight:700; color:#f8fafc; margin-bottom:6px; }
      .glossary-meaning, .quiz-explanation { color:#cbd5e1; }
      .quiz-shell { display:flex; flex-direction:column; gap:16px; }
      .quiz-options { display:grid; gap:10px; margin-top:12px; }
      .quiz-option { display:flex; gap:10px; padding:12px 14px; border-radius:12px; background:rgba(30,41,59,0.82); cursor:pointer; }
      .quiz-feedback { margin-top:10px; min-height:22px; font-weight:600; }
      .quiz-correct { color:#4ade80; } .quiz-wrong { color:#fb923c; }
      .quiz-explanation { margin-top:8px; font-size:.95rem; }
      @media (max-width: 640px) { .page { padding: 18px 14px 40px; } .hero, .panel { border-radius: 18px; } }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="topbar"><a href="../../../index.html">← Back to Home</a><span>Chapter 4</span></div>
      <section class="hero">
        <h1>Chapter 4: Test Analysis and Design</h1>
        <p>Choose test techniques that give useful coverage, expose defects at boundaries, and clarify expected behavior.</p>
        <div class="pill-list"><span class="pill">Black-box techniques</span><span class="pill">White-box techniques</span><span class="pill">Collaboration and ATDD</span></div>
      </section>
      <section class="panel">
        <div class="tabs">
          <button type="button" data-view="en" class="active">English</button>
          <button type="button" data-view="vi">Tiếng Việt</button>
          <button type="button" data-view="quiz1">Quiz 1</button>
          <button type="button" data-view="quiz2">Quiz 2</button>
          <button type="button" data-view="quiz3">Quiz 3</button>
          <button type="button" data-view="glossary">Glossary</button>
          <button type="button" data-view="mindmap">Mind Map</button>
        </div>
        <div id="content-area" class="content-area">Loading chapter content...</div>
      </section>
    </main>
    <script src="./chapter4.js"></script>
  </body>
</html>
